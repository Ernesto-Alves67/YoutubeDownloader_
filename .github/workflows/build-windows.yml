name: Build and Release (Windows)

on:
  push:
    branches:
      - linux-release-not
    tags: [ "*" ]
    paths:
      - 'desktop_version/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:

      # 1) Checkout do repositório
      - name: Check out repository
        uses: actions/checkout@v4

      # 2) Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3) Instalar dependências
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MarkViewDesktop/requirements.txt
          pip install pyinstaller

      # 4) Build com PyInstaller
      - name: Build with PyInstaller
        run: |
            pyinstaller --noconsole --name YouTubeDL --onefile `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.Qt3DRender `
            --exclude-module PySide6.Qt3DExtras `
            --exclude-module PySide6.QtDataVisualization `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtWebEngineWidgets `
            --strip `
            desktop_version/core/ytdl_main.py

      # 5) Compactar o executável (.exe) em zip
      - name: Compressing files
        run: |
            Compress-Archive -Path dist\YouTubeDL\* -DestinationPath dist\ytdl-windows.zip
            dir dist

      # 6) Criar ou atualizar uma Release no GitHub
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v0.1.3
          release_name: "Windows Release v0.1.3"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7) Fazer upload do binário gerado na release
      - name: Upload to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/docviewer-windows.zip
          asset_name: "ytdl-windows.zip"
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
